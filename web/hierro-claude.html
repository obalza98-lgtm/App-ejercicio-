<title>HIERRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {

    --tx: #f5f5f7; --mut: #8b8b96; --acc: #ff3d00; --acc2: #ff0055; --volt: #c8ff00; --bad: #ff4d4d;
    --p: #4fc3ff; --c: #ffb800; --g: #ff5ca8;
    --grad: linear-gradient(135deg, #ff3d00 0%, #ff0055 100%);
    --r: 16px; --disp: 'Anton', Impact, 'Arial Narrow Bold', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.4 Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: flex; background: #0e0e11;
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; background: none; border: 0; color: var(--mut); padding: 9px 0 11px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .5px; position: relative; }
  nav button span { display: block; font-size: 21px; margin-bottom: 1px; filter: grayscale(1) opacity(.6); }
  nav button.on { color: var(--tx); }
  nav button.on span { filter: none; }
  nav button.on::before { content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--grad); border-radius: 0 0 3px 3px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }

  .chip.on { background: var(--tx); border-color: var(--tx); color: var(--bg); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--card2); color: var(--mut); }
  .tag.up { background: var(--volt); color: #000; }

  .hide { display: none !important; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .grid2 .card { margin: 0; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* Hero */
  .hero { position: relative; overflow: hidden; border-radius: var(--r); padding: 18px 16px; margin-bottom: 12px;

    border: 1px solid #3a1a12; }
  .hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 61, 0, .35), transparent 70%); }
  .hero .frase { font-family: var(--disp); font-size: 30px; line-height: 1.05; text-transform: uppercase; letter-spacing: .5px; margin: 6px 0 14px; position: relative; z-index: 1; }

  /* Entrenamiento */
  .sets { width: 100%; border-collapse: collapse; margin-top: 8px; }

  .check { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--mut); font-size: 18px; font-weight: 900; }
  tr.done .check { background: var(--volt); border-color: var(--volt); color: #000; }
  .live { position: sticky; top: 51px; z-index: 4; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 6px; margin-bottom: 12px; }
  .live b { font-family: var(--disp); font-size: 22px; font-weight: 400; display: block; }
  .ex-edit { display: grid; grid-template-columns: 1fr 52px 66px 52px 28px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .ex-edit input { padding: 9px 6px; font-size: 15px; }
  .ex-edit .x { background: none; border: 0; color: var(--bad); font-size: 18px; }

  /* Listas / tablas */
  table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.list th, table.list td { padding: 9px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.list th { color: var(--mut); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item .k { font-weight: 800; white-space: nowrap; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  .empty { text-align: center; color: var(--mut); padding: 22px 8px; }

  /* Barras */
  .bar { height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .mrow { margin-bottom: 10px; }
  .mrow .row { font-size: 13px; }
  .musc { position: relative; height: 22px; background: var(--card2); border-radius: 6px; overflow: hidden; }
  .musc .zone { position: absolute; top: 0; bottom: 0; background: rgba(200, 255, 0, .08); border-left: 1px dashed rgba(200,255,0,.4); border-right: 1px dashed rgba(200,255,0,.4); }
  .musc i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--grad); border-radius: 6px; }
  .musc span { position: absolute; right: 8px; top: 2px; font-size: 12px; font-weight: 800; }

  /* Ring */
  .ring { position: relative; margin: 0 auto; flex: none; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring circle { transition: stroke-dashoffset .6s ease-out; }
  .ring .lbl { position: absolute; inset: 0; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; }

  /* Hoja inferior (modal) */
  #sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .7); display: flex; align-items: flex-end; justify-content: center; }
  #sheetBody { background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; width: 100%; max-width: 720px;
    max-height: 92vh; overflow-y: auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i { position: absolute; inset: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 99px; transition: .2s; }
  .switch i::after { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: var(--mut); border-radius: 50%; transition: .2s; }
  .switch input:checked + i { background: var(--acc); border-color: var(--acc); }
  .switch input:checked + i::after { transform: translateX(20px); background: #fff; }

  #timer { position: fixed; left: 12px; right: 12px; bottom: 82px; z-index: 7; background: var(--grad); color: #fff;
    border-radius: var(--r); padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(255, 61, 0, .35); }
  #timer b { font-family: var(--disp); font-weight: 400; font-size: 28px; font-variant-numeric: tabular-nums; }
  #timer button { background: rgba(0, 0, 0, .25); color: #fff; border: 0; border-radius: 8px; padding: 7px 10px; font-size: 14px; font-weight: 700; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40; background: var(--card2);
    border: 1px solid var(--line); border-left: 4px solid var(--acc); padding: 12px 16px; border-radius: 12px; max-width: 92%;
    text-align: center; font-weight: 600; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); transition: opacity .3s; }
  #toast.pr { border-left-color: var(--volt); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; background: var(--bg); z-index: 50; }
  #loading .logo { font-size: 52px; }
  .canvas-wrap { position: relative; height: 230px; }
</style>


<div id="loading"><div class="logo">HIERRO</div><div class="mut">Calentando…</div></div>

<script>
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmt = (n, d) => { const f = Math.pow(10, d == null ? 1 : d); return (Math.round(n * f) / f).toLocaleString('es'); };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayStr = () => ymd(new Date());
const parseDate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const fmtDate = s => parseDate(s).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' });
const weekStart = s => { const d = parseDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const e1rm = (p, r) => r <= 0 ? 0 : (r === 1 ? p : p * (1 + r / 30)); // Epley
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('hierro_' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('hierro_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('hierro_' + k); } catch (e) {} }
};
function toast(msg, ms, pr) {
  const t = $('#toast'); t.innerHTML = msg; t.className = pr ? 'pr' : ''; t.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.classList.add('hide'), 300); }, ms || 2500);
}
/* Backend: Google Apps Script (google.script.run) o, publicada en Claude, el almacenamiento privado del artifact */
const GAS = !!(window.google && google.script && google.script.run);
function call(fn, ...args) {
  if (!GAS) return LocalAPI.call(fn, args);
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
const LocalAPI = (() => {
  let C = null, RAW = null, ready = null;
  const queue = {};
  const nowIso = () => new Date().toISOString().slice(0, 19);
  const clone = o => JSON.parse(JSON.stringify(o));
  const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('No se pudo conectar con tu almacenamiento. Revisá la conexión.')), ms))]);
  function init() {
    if (ready) return ready;
    ready = (async () => {
      if (!window.claude || !claude.use) throw new Error('Abrí la app desde su link de Claude.');
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) throw new Error('Iniciá sesión en Claude para guardar tus datos.');
      C = db.collection('data/users/' + id);
      const snap = await timeout(C.get(), 15000);
      RAW = { cfg: {}, rutina: [], alimentos: [], pesos: [], ses: {}, com: {} };
      snap.docs.forEach(d => {
        const v = d.exists ? clone(d.data()) : null; if (!v) return;
        if (d.id === 'cfg') RAW.cfg = v.cfg || {};
        else if (d.id === 'rutina') RAW.rutina = v.rows || [];
        else if (d.id === 'alimentos') RAW.alimentos = v.rows || [];
        else if (d.id === 'pesos') RAW.pesos = v.rows || [];
        else if (d.id.startsWith('ses_') && v.id) RAW.ses[v.id] = v;
        else if (d.id.startsWith('com_') && v.fecha) RAW.com[v.fecha] = v.items || [];
      });
    })();
    ready.catch(() => { ready = null; });
    return ready;
  }
  // Una escritura a la vez por documento; el contenido se arma al momento de escribir
  function write(key, build) {
    queue[key] = (queue[key] || Promise.resolve()).catch(() => {}).then(() => {
      const data = build();
      return data ? C.doc(key).set(data) : C.doc(key).delete();
    });
    return queue[key];
  }
  const writeDay = f => write('com_' + f, () => (RAW.com[f] && RAW.com[f].length) ? { tipo: 'com', fecha: f, items: RAW.com[f] } : null);
  const dayOf = id => Object.keys(RAW.com).find(f => RAW.com[f].some(c => c.id === id));
  const API = {
    getData: () => clone({
      rutina: RAW.rutina, alimentos: RAW.alimentos, pesos: RAW.pesos, cfg: RAW.cfg, sheetUrl: null,
      registros: Object.values(RAW.ses).flatMap(s => (s.sets || []).map(x => Object.assign({ sesionId: s.id, fecha: s.fecha, dia: s.dia, notas: s.notas, creado: s.creado }, x))),
      comidas: Object.values(RAW.com).flat()
    }),
    async saveRutina(rows) { RAW.rutina = rows || []; await write('rutina', () => ({ rows: RAW.rutina })); return API.getData(); },
    async saveSesion(s) {
      const id = s.sesionId || uid();
      if (!(s.sets || []).length) throw new Error('No hay series para guardar');
      RAW.ses[id] = { tipo: 'ses', id, fecha: String(s.fecha), dia: s.dia || '', notas: s.notas || '', creado: nowIso(),
        sets: s.sets.map(x => ({ ejercicio: x.ejercicio, serie: Number(x.serie) || 1, peso: Number(x.peso) || 0, reps: Number(x.reps) || 0, rpe: x.rpe === '' || x.rpe == null ? '' : Number(x.rpe) })) };
      await write('ses_' + id, () => RAW.ses[id] || null); return API.getData();
    },
    async deleteSesion(id) { delete RAW.ses[id]; await write('ses_' + id, () => RAW.ses[id] || null); return API.getData(); },
    async addComidas(items) {
      const days = new Set();
      items.forEach(i => { const f = String(i.fecha); (RAW.com[f] = RAW.com[f] || []).push(Object.assign({}, i, { fecha: f, creado: i.creado || nowIso() })); days.add(f); });
      await Promise.all([...days].map(writeDay)); return true;
    },
    async updateComida(item) {
      const f = dayOf(item.id); if (!f) return true;
      RAW.com[f] = RAW.com[f].map(c => c.id === item.id ? Object.assign({}, c, item) : c); await writeDay(f); return true;
    },
    async deleteComida(id) { const f = dayOf(id); if (!f) return true; RAW.com[f] = RAW.com[f].filter(c => c.id !== id); await writeDay(f); return true; },
    async saveAlimento(a) {
      RAW.alimentos = RAW.alimentos.filter(r => String(r.nombre).toLowerCase() !== String(a.nombre).toLowerCase()).concat([a]);
      await write('alimentos', () => ({ rows: RAW.alimentos })); return true;
    },
    async savePeso(fecha, peso) {
      RAW.pesos = RAW.pesos.filter(r => r.fecha !== fecha).concat([{ fecha: String(fecha), peso: Number(peso) }]).sort((a, b) => a.fecha.localeCompare(b.fecha));
      await write('pesos', () => ({ rows: RAW.pesos })); return true;
    },
    async deletePeso(fecha) { RAW.pesos = RAW.pesos.filter(r => r.fecha !== fecha); await write('pesos', () => ({ rows: RAW.pesos })); return true; },
    async saveConfig(cfg) { RAW.cfg = cfg; await write('cfg', () => ({ cfg: RAW.cfg })); return true; }
  };
  return {
    async call(fn, args) {
      await init();
      if (!API[fn]) throw new Error('Esta función solo está en la versión de Google Sheets.');
      return API[fn](...clone(args));
    }
  };
})();

/* IA (solo en la versión publicada en Claude) */
let SAMPLE = null, IMG_OK = false, DOWNLOADS = null;
if (!GAS && window.claude && claude.use) {
  claude.use('sample').then(s => {
    SAMPLE = s;
    if (s) s.limits().then(l => { IMG_OK = !!(l && l.images); }).catch(() => {});
    if (s && (view === 'inicio' || view === 'perfil') && $('#sheet').classList.contains('hide') && $('#loading').classList.contains('hide')) rerender();
  }).catch(() => {});
  claude.use('downloads').then(d => { DOWNLOADS = d; }).catch(() => {});
}
function aiErr(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared') { SAMPLE = null; return 'La IA no está habilitada para esta app.'; }
  if (c === 'rate_limited') return 'Muchas consultas seguidas. Probá en un rato.';
  if (c === 'invalid_json' || c === 'empty_completion') return 'No pude interpretar la respuesta. Probá describirlo de otra forma.';
  if (c === 'image_rejected' || c === 'images_unavailable') return 'No pude usar esa foto. Probá con otra o describilo con texto.';
  if (c === 'cancelled') return '';
  return 'La IA no respondió. Probá de nuevo.';
}
const errMsg = e => esc((e && e.message) || e);
function ring(pct, color, size, inner) {
  const r = (size - 12) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));

function buildSessions() {
  const map = {};
  DB.registros.forEach(r => {
    const s = map[r.sesionId] || (map[r.sesionId] = { id: r.sesionId, fecha: r.fecha, dia: r.dia, notas: r.notas, creado: r.creado, ex: {} });

  });
  sessions = Object.values(map).map(s => {
    s.ejercicios = Object.keys(s.ex).map(n => ({ nombre: n, sets: s.ex[n].sort((a, b) => a.serie - b.serie) }));
    s.vol = sum(s.ejercicios, e => sum(e.sets, x => x.peso * x.reps));
    return s;
  }).sort((a, b) => (b.fecha + (b.creado || '')).localeCompare(a.fecha + (a.creado || '')));
}

function lastSession(ej, excludeId) {
  for (const s of sessions) {
    if (s.id === excludeId) continue;
    const e = s.ejercicios.find(x => norm(x.nombre) === norm(ej));
    if (e) return { fecha: s.fecha, sets: e.sets };
  }
  return null;
}
function parseReps(t) {
  const m = String(t || '').match(/(\d+)\s*[-–a]\s*(\d+)/);
  if (m) return { min: +m[1], max: +m[2] };
  const n = parseInt(t, 10); return n ? { min: n, max: n } : null;
}
/** Sobrecarga progresiva automática */
function suggest(ej, repsTxt, seriesObj, inc) {
  const last = lastSession(ej);
  if (!last || !last.sets.length) return null;
  const rng = parseReps(repsTxt);
  inc = num(inc) || 2.5;
  const top = Math.max(...last.sets.map(s => s.peso));
  const work = last.sets.filter(s => s.peso === top);
  if (!rng) return { peso: top, tipo: 'keep', txt: 'Repetí ' + fmt(top) + ' kg' };
  if ((!seriesObj || work.length >= seriesObj) && work.every(s => s.reps >= rng.max)) return { peso: top + inc, tipo: 'up', txt: '⬆ SUBÍ A ' + fmt(top + inc) + ' KG' };
  if (work.some(s => s.reps < rng.min)) return { peso: top, tipo: 'keep', txt: 'Mantené ' + fmt(top) + ' kg · apuntá a ' + rng.min + '+ reps' };
  return { peso: top, tipo: 'keep', txt: 'Mantené ' + fmt(top) + ' kg · sumá reps' };
}

function streak() {

  if ((by[w] || 0) < goal) w = addDays(w, -7);
  while ((by[w] || 0) >= goal) { n++; w = addDays(w, -7); }

}

/* =====================================================================
   OBJETIVOS NUTRICIONALES
   ===================================================================== */
function targets() {
  const c = DB.cfg, w = latestWeight() || num(c.peso) || 75, h = num(c.altura) || 175, a = num(c.edad) || 30, act = num(c.actividad) || 1.55;
  const bmr = 10 * w + 6.25 * h - 5 * a + (c.sexo === 'f' ? -161 : 5);
  const tdee = bmr * act;
  const adj = { perder: -450, mantener: 0, ganar: 300 }[c.objetivo || 'mantener'];
  const manual = num(c.kcalManual) > 0;
  const kcal = manual ? num(c.kcalManual) : Math.round((tdee + adj + num(c.kcalAjuste)) / 50) * 50;
  const prot = Math.round(w * (c.objetivo === 'perder' ? 2.2 : 2));
  const grasa = Math.round(w * 0.8);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - grasa * 9) / 4));
  return { kcal, prot, carb, grasa, tdee: Math.round(tdee), completo: !!(c.altura && c.edad), manual };
}
/** Ajuste automático: compara la tendencia real de tu peso con la que buscás */
function autoAjuste() {
  const c = DB.cfg;
  if (num(c.kcalManual) > 0) return null;
  if (c.ajusteFecha && daysBetween(c.ajusteFecha, todayStr()) < 14) return null;
  const since = addDays(todayStr(), -21);
  const pts = DB.pesos.filter(p => p.fecha >= since).map(p => ({ x: daysBetween(since, p.fecha), y: num(p.peso) }));
  if (pts.length < 6 || Math.max(...pts.map(p => p.x)) - Math.min(...pts.map(p => p.x)) < 10) return null;
  const mx = sum(pts, p => p.x) / pts.length, my = sum(pts, p => p.y) / pts.length;
  const slope = sum(pts, p => (p.x - mx) * (p.y - my)) / sum(pts, p => (p.x - mx) ** 2) * 7; // kg/semana
  const obj = c.objetivo || 'mantener';
  const meta = { perder: -0.005 * my, mantener: 0, ganar: 0.0025 * my }[obj];
  let adj = Math.round((-(slope - meta) * 7700 / 7) / 50) * 50;
  adj = Math.max(-300, Math.min(300, adj));
  if (Math.abs(adj) < 100) return null;
  return { adj, slope, meta };
}

function recentPRs(days) {
  const since = addDays(todayStr(), -days), out = [];
  const best = {};
  sessions.slice().reverse().forEach(s => s.ejercicios.forEach(e => {
    const k = norm(e.nombre), top = Math.max(...e.sets.map(x => x.peso));
    if (best[k] != null && top > best[k] && s.fecha >= since) out.push({ ej: e.nombre, peso: top, fecha: s.fecha });
    best[k] = Math.max(best[k] || 0, top);
  }));
  return out.reverse();
}

function newSetsFor(nombre, series, repsTxt, inc) {
  const last = lastSession(nombre), sug = suggest(nombre, repsTxt, series, inc);
  const n = Math.max(series || (last ? last.sets.length : 3), 1), sets = [];
  for (let i = 0; i < n; i++) {
    const prev = last ? (last.sets[i] || last.sets[last.sets.length - 1]) : null;
    let peso = prev ? prev.peso : '';
    if (sug && sug.tipo === 'up' && prev && Math.abs(prev.peso - (sug.peso - (num(inc) || 2.5))) < 0.01) peso = sug.peso;
    sets.push({ peso, reps: '', rpe: '', done: false, prev: prev ? fmt(prev.peso) + '×' + prev.reps : '' });
  }
  return sets;
}

function upd(i, j, k, v) { workout.ejercicios[i].sets[j][k] = v; saveDraft(); updateLive(); }

async function finishWorkout() {
  const sets = [];
  workout.ejercicios.forEach(e => { let k = 0; e.sets.forEach(s => { const reps = num(s.reps); if (reps > 0) sets.push({ ejercicio: e.nombre, serie: ++k, peso: num(s.peso), reps, rpe: s.rpe === '' ? '' : num(s.rpe) }); }); });
  if (!sets.length) return toast('Cargá las reps de al menos una serie');
  const prs = workout.sesionId ? [] : detectPRs(sets);
  const vol = sum(sets, s => s.peso * s.reps);
  const btn = $('#btnSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    setData(await call('saveSesion', { sesionId: workout.sesionId || '', fecha: workout.fecha, dia: workout.dia, notas: workout.notas, sets }));
    const editado = !!workout.sesionId;

    else toast(esc(pick(FRASES_FIN)) + (vol ? '<br><span class="small mut">' + fmt(vol, 0) + ' kg movidos</span>' : ''), 3500);
  } catch (err) {
    toast('Error al guardar: ' + errMsg(err) + '<br>Tu entrenamiento sigue guardado en el teléfono.', 5000);
    btn.disabled = false; btn.textContent = '🔥 Terminar entrenamiento';
  }
}
function detectPRs(sets) {
  const out = [], by = {};
  sets.forEach(s => (by[s.ejercicio] = by[s.ejercicio] || []).push(s));
  Object.keys(by).forEach(ex => {
    const h = DB.registros.filter(r => norm(r.ejercicio) === norm(ex));
    if (!h.length) return;
    const maxP = Math.max(...h.map(r => num(r.peso))), max1 = Math.max(...h.map(r => e1rm(num(r.peso), num(r.reps))));
    const nP = Math.max(...by[ex].map(s => s.peso)), n1 = Math.max(...by[ex].map(s => e1rm(s.peso, s.reps)));
    if (nP > maxP) out.push(ex + ': ' + fmt(nP) + ' kg (antes ' + fmt(maxP) + ')');
    else if (n1 > max1 + 0.01) out.push(ex + ': 1RM est. ' + fmt(n1) + ' kg');
  });
  return out;
}

}

let FS = null; // estado del buscador de alimentos
function foodLibrary() {
  const seen = new Set(), out = [];
  const add = f => { const k = norm(f.nombre); if (!seen.has(k)) { seen.add(k); out.push(f); } };
  recents().forEach(add);
  DB.alimentos.forEach(a => add({ nombre: a.nombre, kcal: num(a.kcal), prot: num(a.prot), carb: num(a.carb), grasa: num(a.grasa), porcion: num(a.porcion) || 100, plabel: 'porción', src: 'propio' }));
  LOCAL_FOODS.forEach(add);
  return out;
}
function recents() {
  const seen = new Set(), out = [];
  DB.comidas.slice().sort((a, b) => String(b.creado || b.fecha).localeCompare(String(a.creado || a.fecha))).forEach(c => {
    const g = num(c.gramos), k = norm(c.alimento);
    if (!g || seen.has(k)) return; seen.add(k);
    out.push({ nombre: c.alimento, kcal: num(c.kcal) * 100 / g, prot: num(c.prot) * 100 / g, carb: num(c.carb) * 100 / g, grasa: num(c.grasa) * 100 / g, porcion: g, plabel: 'última vez', src: 'reciente' });
  });
  return out;
}
function openFood(comida) {
  FS = { comida, q: '', list: [], online: [], buscando: false };
  openSheet(`
    <div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">${esc(comida)}</h2><button class="btn sec" onclick="closeSheet()">✕</button></div>
    <input id="fq" placeholder="${GAS ? 'Buscar alimento o código de barras…' : 'Buscar alimento…'}" oninput="FS.q=this.value;renderFoodList()" autocomplete="off">
    <div class="chips" style="margin:10px 0">
      ${SAMPLE ? `<button class="chip on" onclick="aiFoodForm()">🤖 Describir o foto</button>` : ''}
      ${GAS ? `<button class="chip" onclick="searchOnline()">🌐 Buscar online</button>` : ''}
      <button class="chip" onclick="createFoodForm()">✚ Crear</button>
      <button class="chip" onclick="quickKcal()">⚡ Calorías rápidas</button>
    </div>
    <div id="foodList"></div>`);
  renderFoodList();
}
function renderFoodList() {
  const q = norm(FS.q).trim();
  const lib = foodLibrary();
  FS.list = q ? lib.filter(f => q.split(/\s+/).every(w => norm(f.nombre).includes(w))).slice(0, 40) : lib.filter(f => f.src === 'reciente').slice(0, 15);
  if (!q && !FS.list.length) FS.list = LOCAL_FOODS.slice(0, 15);
  const row = (f, i, pre) => `<div class="item" onclick="selectFood('${pre}',${i})"><div class="grow"><div>${esc(f.nombre)}</div>
    <div class="small mut">${fmt(f.kcal, 0)} kcal · P ${fmt(f.prot, 0)} · C ${fmt(f.carb, 0)} · G ${fmt(f.grasa, 0)} <span style="opacity:.6">/100 g</span>${f.src === 'reciente' ? ' · 🕘' : f.src === 'propio' ? ' · ⭐' : ''}</div></div><span class="mut">›</span></div>`;
  $('#foodList').innerHTML =
    `<div class="eyebrow" style="margin:6px 0">${q ? 'Resultados' : 'Recientes'}</div>` +
    (FS.list.map((f, i) => row(f, i, 'l')).join('') || `<div class="empty small">Nada en tu base. Probá ${SAMPLE ? '“🤖 Describir o foto”' : GAS ? '“Buscar online”' + (/^\d{8,14}$/.test(q) ? ' (código de barras)' : '') : '“⚡ Calorías rápidas”'} o creá el alimento.</div>`) +
    (FS.buscando ? '<div class="empty">Buscando en internet…</div>' : '') +
    (FS.online.length ? '<div class="eyebrow" style="margin:14px 0 6px">🌐 Online (Open Food Facts)</div>' + FS.online.map((f, i) => row(f, i, 'o')).join('') : '');

let coachCtl = null;
async function coach() {
  const out = $('#coachOut'), btn = $('#coachBtn'); if (!out || !SAMPLE) return;
  if (coachCtl) { coachCtl.abort(); return; }
  const c = DB.cfg, T = targets(), goal = num(c.entrenosSemana) || 3, since = addDays(todayStr(), -28);
  const ses = sessions.filter(s => s.fecha >= since).reverse().map(s => s.fecha + ' ' + (s.dia || 'Libre') + ': ' +
    s.ejercicios.map(e => e.nombre + ' ' + e.sets.map(x => x.peso + 'x' + x.reps).join(',')).join(' | ')).join('\n');
  const com = []; for (let i = 13; i >= 0; i--) { const f = addDays(todayStr(), -i), t = dayTotals(f); if (t.n) com.push(f + ': ' + Math.round(t.kcal) + ' kcal, ' + Math.round(t.prot) + ' g proteína'); }
  const pes = DB.pesos.filter(p => p.fecha >= since).map(p => p.fecha + ': ' + p.peso + ' kg').join(', ');
  const prompt = 'Sos el coach de HIERRO, una app de gym. Hablás en español latino, directo, con energía y sin vueltas, como un buen entrenador. ' +
    'Analizá los datos de las últimas 4 semanas y respondé en texto plano (sin tablas ni títulos markdown), máximo 170 palabras, con este formato:\n' +
    'Una línea de veredicto.\n• Lo que viene bien (1-2 viñetas)\n• Lo que hay que corregir (1-2 viñetas)\n• 3 acciones concretas para esta semana, con números (kg, reps, kcal, proteína).\n' +
    'Si faltan datos, decilo y pedí registrarlos.\n\n' +
    `Perfil: objetivo ${c.objetivo || 'mantener'}, meta ${goal} entrenamientos por semana, objetivo ${T.kcal} kcal y ${T.prot} g de proteína por día. Hoy es ${todayStr()}.\n` +
    'Entrenamientos (peso x reps por serie):\n' + (ses || 'ninguno registrado') + '\n\nComida (días registrados):\n' + (com.join('\n') || 'nada registrado') +
    '\n\nPeso corporal: ' + (pes || 'sin registros');
  coachCtl = new AbortController();
  btn.textContent = 'Detener'; out.textContent = 'Analizando tus semanas…'; out.classList.add('mut');
  try {
    await SAMPLE(prompt.slice(0, 60000), { cache: false, signal: coachCtl.signal, onText: ({ text }) => { out.classList.remove('mut'); out.textContent = text; } });
  } catch (e) { const m = aiErr(e); out.textContent = (e && e.text) || ''; if (m) toast(m, 4000); }
  coachCtl = null; if ($('#coachBtn')) $('#coachBtn').textContent = '🤖 Analizar de nuevo';
}
function coachCard() {
  return SAMPLE ? `<div class="card"><div class="eyebrow">🤖 Coach IA</div>
    <p class="small mut" style="margin:4px 0 10px">Lee tus entrenamientos, comidas y peso de las últimas 4 semanas y te dice qué ajustar.</p>
    <div id="coachOut" style="white-space:pre-wrap;margin-bottom:10px"></div>
    <button class="btn block" id="coachBtn" onclick="coach()">🤖 Analizar mis últimas 4 semanas</button></div>` : '';
}

async function exportData(kind) {
  if (!DOWNLOADS) return toast('Descargas no disponibles acá');
  const d = todayStr();
  let filename, data;
  if (kind === 'json') { filename = 'hierro-respaldo-' + d + '.json'; data = JSON.stringify({ rutina: DB.rutina, registros: DB.registros, comidas: DB.comidas, alimentos: DB.alimentos, pesos: DB.pesos, cfg: DB.cfg }, null, 1); }
  else {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['fecha', 'dia', 'ejercicio', 'serie', 'peso', 'reps', 'rpe']].concat(DB.registros.slice().sort((a, b) => String(a.fecha).localeCompare(b.fecha)).map(r => [r.fecha, r.dia, r.ejercicio, r.serie, r.peso, r.reps, r.rpe]));
    filename = 'hierro-series-' + d + '.csv'; data = rows.map(r => r.map(q).join(',')).join('\n');
  }
  try { await DOWNLOADS.save({ filename, data }); } catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') toast('No se pudo descargar', 3000); }
}

function delComida(id) {
  DB.comidas = DB.comidas.filter(x => x.id !== id); cacheNow(); closeSheet(); rerender();
  call('deleteComida', id).catch(e => toast('No se pudo borrar: ' + errMsg(e), 4000));
}
function copyDay() {
  const src = DB.comidas.filter(c => c.fecha === addDays(foodDate, -1));
  if (!src.length) return toast('El día anterior no tiene comidas');
  if (!confirm('¿Copiar ' + src.length + ' alimentos del día anterior a este día?')) return;
  addComidaRows(src.map(c => Object.assign({}, c, { id: uid(), fecha: foodDate })), '⧉ ' + src.length + ' alimentos copiados');
}

/* =====================================================================
   PROGRESO
   ===================================================================== */
let pMetric = 'peso', pGroup = 'sesion';
const METRIC_LBL = { peso: 'Peso máx (kg)', e1rm: '1RM estimado (kg)', vol: 'Volumen (kg)', reps: 'Reps totales' };
function exSeries(ex) {
  return sessions.slice().reverse().map(s => {
    const e = s.ejercicios.find(x => norm(x.nombre) === norm(ex)); if (!e) return null;
    return { fecha: s.fecha, peso: Math.max(...e.sets.map(x => x.peso)), e1rm: Math.max(...e.sets.map(x => e1rm(x.peso, x.reps))),
      vol: sum(e.sets, x => x.peso * x.reps), reps: sum(e.sets, x => x.reps), sets: e.sets };
  }).filter(Boolean);
}
function groupWeekly(pts) {
  const m = {};
  pts.forEach(p => { const w = weekStart(p.fecha), g = m[w] || (m[w] = { fecha: w, peso: 0, e1rm: 0, vol: 0, reps: 0, n: 0 });
    g.peso = Math.max(g.peso, p.peso); g.e1rm = Math.max(g.e1rm, p.e1rm); g.vol += p.vol; g.reps += p.reps; g.n++; });
  return Object.values(m).sort((a, b) => a.fecha.localeCompare(b.fecha));
}
function renderProgreso() {
  const exs = allExercises().filter(e => DB.registros.some(r => norm(r.ejercicio) === norm(e)));
  const el = $('#v-progreso');
  if (!exs.length && !DB.pesos.length && !DB.comidas.length) { el.innerHTML = '<div class="card empty">Todavía no hay datos. Andá a entrenar 💪</div>'; return; }
  let ex = store.get('pEx'); if (!exs.includes(ex)) ex = exs[0];
  const pts = ex ? exSeries(ex) : [], data = pGroup === 'semana' ? groupWeekly(pts) : pts;

  // series por grupo muscular esta semana
  const ws = weekStart(todayStr()), mg = {};
  sessions.filter(s => s.fecha >= ws).forEach(s => s.ejercicios.forEach(e => { const g = grupoDe(e.nombre); mg[g] = (mg[g] || 0) + e.sets.length; }));
  const grupos = GRUPOS.map(g => g[0]).concat(['Otro']).filter(g => mg[g] || g !== 'Otro');

  let statsHtml = '', tableHtml = '';
  if (pts.length) {
    const first = pts[0], last = pts[pts.length - 1];
    const ref4 = pts.filter(p => p.fecha <= addDays(todayStr(), -28)).pop() || first;
    const d = (a, b) => `<span class="${a - b >= 0 ? 'volt' : 'neg'}">${a - b >= 0 ? '+' : ''}${fmt(a - b)}</span>`;
    statsHtml = `<div class="grid3" style="margin-bottom:12px">
      <div class="card" style="margin:0"><div class="eyebrow">Récord</div><div class="big" style="font-size:26px">${fmt(Math.max(...pts.map(p => p.peso)))}</div><div class="small mut">1RM ${fmt(Math.max(...pts.map(p => p.e1rm)))}</div></div>
      <div class="card" style="margin:0"><div class="eyebrow">Desde inicio</div><div class="big" style="font-size:26px">${d(last.peso, first.peso)}</div><div class="small mut">kg</div></div>
      <div class="card" style="margin:0"><div class="eyebrow">4 semanas</div><div class="big" style="font-size:26px">${d(last.peso, ref4.peso)}</div><div class="small mut">kg · ${pts.length} sesiones</div></div></div>`;
    const rows = data.slice().reverse().slice(0, 30);
    tableHtml = `<div class="card"><h2>${pGroup === 'semana' ? 'Semana a semana' : 'Día a día'}</h2><table class="list">
      <tr><th>${pGroup === 'semana' ? 'Semana' : 'Fecha'}</th><th>Máx</th><th>±</th><th>${pGroup === 'semana' ? 'Ses.' : 'Series'}</th><th>Vol.</th></tr>
      ${rows.map((p, i) => { const prev = rows[i + 1], dv = prev ? p.peso - prev.peso : 0;
        return `<tr><td>${esc(fmtDate(p.fecha))}</td><td><b>${fmt(p.peso)}</b></td><td class="${dv > 0 ? 'volt' : dv < 0 ? 'neg' : 'mut'}">${prev ? (dv > 0 ? '+' : '') + fmt(dv) : '—'}</td>
        <td class="mut small">${pGroup === 'semana' ? p.n : esc(p.sets.map(s => fmt(s.peso) + '×' + s.reps).join(', '))}</td><td>${fmt(p.vol, 0)}</td></tr>`; }).join('')}</table></div>`;
  }

  el.innerHTML = `
    ${exs.length ? `<div class="card">
      <select onchange="store.set('pEx',this.value);renderProgreso()">${exs.map(e => `<option ${e === ex ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
      <div class="chips" style="margin-top:10px">${Object.keys(METRIC_LBL).map(m => `<button class="chip ${m === pMetric ? 'on' : ''}" onclick="pMetric='${m}';renderProgreso()">${METRIC_LBL[m].replace(/ \(.*\)/, '')}</button>`).join('')}</div>
      <div class="chips" style="margin-top:8px"><button class="chip ${pGroup === 'sesion' ? 'on' : ''}" onclick="pGroup='sesion';renderProgreso()">Por día</button>
        <button class="chip ${pGroup === 'semana' ? 'on' : ''}" onclick="pGroup='semana';renderProgreso()">Por semana</button></div></div>
    ${statsHtml}
    <div class="card"><div class="canvas-wrap"><canvas id="cEx"></canvas></div></div>
    ${tableHtml}` : ''}

    <div class="card"><h2>Series por músculo · esta semana</h2>
      <p class="small mut" style="margin-top:-6px">Zona verde = 10–20 series semanales (rango recomendado para crecer).</p>
      ${grupos.map(g => `<div class="row" style="margin-bottom:6px"><span style="width:70px" class="small"><b>${g}</b></span>
        <div class="musc grow"><div class="zone" style="left:${10 / 25 * 100}%;width:${10 / 25 * 100}%"></div><i style="width:${Math.min(100, (mg[g] || 0) / 25 * 100)}%"></i><span>${mg[g] || 0}</span></div></div>`).join('')}
    </div>

    <div class="card"><h2>Volumen semanal</h2><div class="canvas-wrap"><canvas id="cVol"></canvas></div></div>
    ${DB.pesos.length ? `<div class="card"><h2>Peso corporal</h2><div class="canvas-wrap"><canvas id="cPeso"></canvas></div></div>` : ''}
    ${DB.comidas.length ? `<div class="card"><h2>Calorías · 14 días</h2><div class="canvas-wrap"><canvas id="cKcal"></canvas></div></div>` : ''}
    ${exs.length ? `<div class="card"><h2>🏆 Récords personales</h2><table class="list"><tr><th>Ejercicio</th><th>Máx</th><th>1RM est.</th></tr>
      ${exs.map(e => { const s = exSeries(e); return `<tr><td>${esc(e)}</td><td><b>${fmt(Math.max(...s.map(p => p.peso)))}</b></td><td>${fmt(Math.max(...s.map(p => p.e1rm)))}</td></tr>`; }).join('')}</table></div>` : ''}`;

  const grad = ctx => { const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 230); g.addColorStop(0, 'rgba(255,61,0,.45)'); g.addColorStop(1, 'rgba(255,0,85,0)'); return g; };
  if (pts.length) mkChart('cEx', { type: pMetric === 'vol' || pMetric === 'reps' ? 'bar' : 'line',
    data: { labels: data.map(p => fmtDate(p.fecha)), datasets: [{ data: data.map(p => Math.round(p[pMetric] * 10) / 10), borderColor: '#ff3d00', backgroundColor: grad,
      fill: true, tension: .3, pointRadius: 3, pointBackgroundColor: '#ff3d00', borderWidth: 3, borderRadius: 6 }] },
    options: chartOpts({ plugins: { legend: { display: false }, title: { display: true, text: METRIC_LBL[pMetric].toUpperCase(), color: '#f5f5f7' } } }) });

  const wk = {}; sessions.forEach(s => { const w = weekStart(s.fecha); wk[w] = (wk[w] || 0) + s.vol; });
  const wks = Object.keys(wk).sort().slice(-16);
  mkChart('cVol', { type: 'bar', data: { labels: wks.map(fmtDate), datasets: [{ data: wks.map(w => Math.round(wk[w])), backgroundColor: '#ff3d00', borderRadius: 6 }] }, options: chartOpts() });

  if (DB.pesos.length) {
    const ps = DB.pesos.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).slice(-60);
    const ma = ps.map((p, i) => { const w = ps.slice(Math.max(0, i - 6), i + 1); return Math.round(sum(w, x => num(x.peso)) / w.length * 10) / 10; });
    mkChart('cPeso', { type: 'line', data: { labels: ps.map(p => fmtDate(p.fecha)), datasets: [
      { label: 'Peso', data: ps.map(p => num(p.peso)), borderColor: 'rgba(79,195,255,.4)', pointRadius: 2, borderWidth: 1 },
      { label: 'Promedio 7 días', data: ma, borderColor: '#4fc3ff', pointRadius: 0, borderWidth: 3, tension: .3 }] },
      options: chartOpts({ plugins: { legend: { display: true, labels: { color: '#8b8b96', boxWidth: 12 } } } }) });
  }
  if (DB.comidas.length) {
    const ds = []; for (let i = 13; i >= 0; i--) ds.push(addDays(todayStr(), -i));
    const T = targets();
    mkChart('cKcal', { type: 'bar', data: { labels: ds.map(fmtDate), datasets: [
      { type: 'line', label: 'Objetivo', data: ds.map(() => T.kcal), borderColor: '#c8ff00', borderDash: [6, 4], pointRadius: 0, borderWidth: 2 },
      { label: 'kcal', data: ds.map(d => Math.round(dayTotals(d).kcal)), backgroundColor: ds.map(d => dayTotals(d).kcal > T.kcal * 1.05 ? '#ff4d4d' : '#ff3d00'), borderRadius: 6 }] },
      options: chartOpts() });
  }
}

/* =====================================================================
   PERFIL
   ===================================================================== */
function renderPerfil() {
  const c = DB.cfg, T = targets(), a = c.auto || {};
  const pesos = DB.pesos.slice().sort((x, y) => y.fecha.localeCompare(x.fecha));
  const sel = (id, opts, v) => `<select id="${id}">${opts.map(o => `<option value="${o[0]}" ${String(o[0]) === String(v) ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  $('#v-perfil').innerHTML = `
    <div class="card"><h2>⚖️ Peso corporal</h2>
      <div class="row"><input id="pw" inputmode="decimal" placeholder="Peso de hoy (kg)" class="grow" value="${pesos[0] && pesos[0].fecha === todayStr() ? pesos[0].peso : ''}">
        <button class="btn" onclick="savePesoUI($('#pw').value)">Guardar</button></div>
      <p class="small mut">Pesate a la mañana, en ayunas. La app usa el promedio de 7 días para ajustar tus calorías sola.</p>
      ${pesos.slice(0, 7).map(p => `<div class="item" style="cursor:default"><span class="grow">${esc(fmtDate(p.fecha))}</span><b>${fmt(num(p.peso))} kg</b>
        <button class="btn danger" onclick="delPesoUI('${esc(p.fecha)}')">✕</button></div>`).join('')}
    </div>

    <div class="card"><h2>🎯 Objetivos</h2>
      <div class="grid2" style="margin:0">
        <div><label class="f">Sexo</label>${sel('fsexo', [['m', 'Hombre'], ['f', 'Mujer']], c.sexo || 'm')}</div>
        <div><label class="f">Edad</label><input id="fedad" inputmode="numeric" value="${esc(c.edad || '')}"></div>
        <div><label class="f">Altura (cm)</label><input id="falt" inputmode="numeric" value="${esc(c.altura || '')}"></div>
        <div><label class="f">Entrenos / semana</label><input id="fent" inputmode="numeric" value="${esc(c.entrenosSemana || 3)}"></div>
      </div>
      <label class="f">Actividad (fuera del gym)</label>${sel('fact', [[1.375, 'Sedentario (oficina)'], [1.55, 'Moderada (de pie, camino)'], [1.725, 'Alta (trabajo físico)'], [1.9, 'Muy alta']], c.actividad || 1.55)}
      <label class="f">Objetivo</label>${sel('fobj', [['perder', '🔥 Definir (bajar grasa)'], ['mantener', '⚖️ Recomposición / mantener'], ['ganar', '💪 Volumen (ganar masa)']], c.objetivo || 'mantener')}
      <label class="f">Calorías manuales (opcional, deja vacío para cálculo automático)</label><input id="fman" inputmode="numeric" value="${esc(c.kcalManual || '')}">
      <div class="grid3" style="margin-top:14px">
        <div class="center"><div class="big hot" style="font-size:24px">${T.kcal}</div><div class="eyebrow">kcal</div></div>
        <div class="center"><div class="big" style="font-size:24px;color:var(--p)">${T.prot}g</div><div class="eyebrow">Proteína</div></div>
        <div class="center"><div class="big" style="font-size:24px;color:var(--c)">${T.carb}g</div><div class="eyebrow">Carbos</div></div>
      </div>
      <p class="small mut center">Grasas ${T.grasa} g · Mantenimiento ≈ ${T.tdee} kcal${num(c.kcalAjuste) ? ' · Ajuste automático ' + (c.kcalAjuste > 0 ? '+' : '') + c.kcalAjuste + ' kcal' : ''}</p>
      <button class="btn block" onclick="saveProfile()">Guardar objetivos</button>
      ${num(c.kcalAjuste) ? `<div class="center"><button class="btn ghost small" onclick="DB.cfg.kcalAjuste=0;saveCfg().then(renderPerfil)">Resetear ajuste automático</button></div>` : ''}
    </div>

    ${GAS ? '' : `<div class="card"><h2>🤖 Automático</h2>
      <p class="small mut" style="margin-top:-6px">La app ya hace sola: sugerencia de peso por ejercicio, detección de récords, grupo muscular de cada ejercicio y ajuste de calorías según tu peso real.${SAMPLE ? ' El Coach IA está en Inicio.' : ''}</p>
      ${DOWNLOADS ? `<div class="row"><button class="btn sec grow" onclick="exportData('json')">⬇ Respaldo completo</button><button class="btn sec grow" onclick="exportData('csv')">⬇ Series (CSV)</button></div>` : ''}
      <p class="small mut">Tus datos se guardan en tu cuenta de Claude, privados: solo vos los ves.</p></div>`}
    <div class="card${GAS ? '' : ' hide'}"><h2>🤖 Automatizaciones</h2>
      <p class="small mut" style="margin-top:-6px">Corren solas en los servidores de Google aunque no abras la app. Te llegan por mail.</p>
      <div class="item" style="cursor:default"><div class="grow"><b>Reporte semanal</b><div class="small mut">Lunes 8 am: entrenos, volumen, récords, calorías y peso.</div></div>
        <label class="switch"><input type="checkbox" id="aSem" ${a.semanal ? 'checked' : ''}><i></i></label></div>
      <div class="item" style="cursor:default"><div class="grow"><b>Recordatorio diario</b><div class="small mut">Solo si no registraste comida, hace 3+ días que no entrenás o no te pesás hace una semana.</div></div>
        <label class="switch"><input type="checkbox" id="aRec" ${a.recordatorio ? 'checked' : ''}><i></i></label></div>
      <div class="row" style="margin-top:8px"><label class="small mut grow">Hora del recordatorio</label>
        <select id="aHora" style="width:110px">${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${(a.hora == null ? 21 : a.hora) == h ? 'selected' : ''}>${h}:00</option>`).join('')}</select></div>
      <div class="row" style="margin-top:12px"><button class="btn grow" onclick="saveAuto()">Activar</button><button class="btn sec" onclick="testReport()">📧 Probar</button></div>
      <p class="small mut">También automático: sugerencia de peso por ejercicio, detección de récords, grupo muscular de cada ejercicio y ajuste de calorías según tu peso real.</p>
    </div>

    <div class="card"><h2>📊 Tus números</h2>
      <div class="grid3">
        <div class="center"><div class="big" style="font-size:26px">${sessions.length}</div><div class="eyebrow">Entrenos</div></div>
        <div class="center"><div class="big" style="font-size:26px">${fmt(sum(sessions, s => s.vol) / 1000)}t</div><div class="eyebrow">Levantadas</div></div>
        <div class="center"><div class="big" style="font-size:26px">${DB.registros.length}</div><div class="eyebrow">Series</div></div>
      </div>
      <p class="center mut small">${esc(comparacion(sum(sessions, s => s.vol)))}</p>
      ${DB.sheetUrl ? `<a class="btn sec block" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="${esc(DB.sheetUrl)}" target="_blank">Abrir mi planilla de datos ↗</a>` : ''}
    </div>`;
}
async function saveProfile() {
  Object.assign(DB.cfg, { sexo: $('#fsexo').value, edad: num($('#fedad').value), altura: num($('#falt').value), entrenosSemana: num($('#fent').value) || 3,
    actividad: num($('#fact').value), objetivo: $('#fobj').value, kcalManual: num($('#fman').value) });
  await saveCfg(); renderPerfil(); renderHeader(); toast('🎯 Objetivo: ' + targets().kcal + ' kcal · ' + targets().prot + ' g proteína');
}
function pesoSheet() {
  openSheet(`<div class="row"><h2 class="grow" style="margin:0">⚖️ Peso de hoy</h2><button class="btn sec" onclick="closeSheet()">✕</button></div>
    <input id="pw2" inputmode="decimal" placeholder="kg" style="margin:12px 0;font-size:28px;text-align:center" value="${latestWeight() || ''}">
    <button class="btn block" onclick="savePesoUI($('#pw2').value);closeSheet()">Guardar</button>`);
}
function savePesoUI(v) {
  const p = num(v); if (p < 20 || p > 400) return toast('Peso inválido');
  const f = todayStr();
  DB.pesos = DB.pesos.filter(x => x.fecha !== f).concat([{ fecha: f, peso: p }]); cacheNow(); rerender(); toast('⚖️ ' + fmt(p) + ' kg guardado');
  call('savePeso', f, p).catch(e => toast('No se pudo guardar: ' + errMsg(e), 4000));
}
function delPesoUI(f) {
  DB.pesos = DB.pesos.filter(x => x.fecha !== f); cacheNow(); rerender();
  call('deletePeso', f).catch(e => toast('No se pudo borrar: ' + errMsg(e), 4000));
}
async function saveAuto() {
  try {
    toast('Configurando…');
    const r = await call('setupAutomations', { semanal: $('#aSem').checked, recordatorio: $('#aRec').checked, hora: num($('#aHora').value) });
    DB.cfg.auto = r.auto; cacheNow();
    toast(r.auto.semanal || r.auto.recordatorio ? '🤖 Listo. Te llegan los mails a ' + esc(r.email) : 'Automatizaciones desactivadas', 4000);
  } catch (e) { toast('Error: ' + errMsg(e), 5000); }
}
async function testReport() {
  try { toast('Enviando…'); const em = await call('sendReportNow'); toast('📧 Reporte enviado a ' + esc(em), 4000); }
  catch (e) { toast('Error: ' + errMsg(e), 5000); }
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
setInterval(() => { if (workout && view === 'entrenar') updateLive(); }, 1000);
(function init() {
  workout = store.get('draft');
  const cache = store.get('cache');
  if (cache) { setData(cache); $('#loading').classList.add('hide'); show('inicio'); }
  call('getData').then(d => {
    setData(d); $('#loading').classList.add('hide');
    if (!$('#sheet').classList.contains('hide')) return; // no interrumpir si hay un modal abierto
    const editing = view === 'entrenar' && entrenarMode === 'rutina';
    if (!editing && !(view === 'entrenar' && workout)) show(view); else renderHeader();
    if (workout) toast('Retomaste tu entrenamiento en curso');
  }).catch(err => {
    if (cache) return toast('Sin conexión: mostrando datos guardados', 4000);
    $('#loading').innerHTML = '<div class="logo">HIERRO</div><div style="padding:20px;text-align:center" class="mut">No se pudieron cargar los datos.<br><small>' + errMsg(err) + '</small></div>';
  });
})();
</script>
